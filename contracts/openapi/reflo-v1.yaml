openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: REFLO API
  version: 1.0.0
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
  description: |
    REFLO browser application API and Internal Worker API contract.
    Public project routes never expose object-store keys or Temporal workflow IDs.
  x-reflo-api-major: 1
servers:
  - url: /
    description: Same-origin REFLO server
tags:
  - name: Auth
    description: Google authentication and server session lifecycle.
  - name: Companies
    description: Supported-company discovery.
  - name: Projects
    description: User-owned project collection.
  - name: Setup
    description: Step 1 project setup.
  - name: Files
    description: Step 2 upload, inspection, and mapping.
  - name: Hypothesis
    description: Step 3 investment thesis and research questions.
  - name: Research
    description: Step 4 plan approval, collection, and ingestion jobs.
  - name: Validation
    description: Step 5 evidence review and workbook validation.
  - name: Valuation
    description: Step 6 authoritative PER valuation.
  - name: ReportOutline
    description: Step 7 template-constrained page outline.
  - name: Report
    description: Versioned report editing, validation, approval, and export.
  - name: Artifacts
    description: Authorized artifact download descriptors.
  - name: InternalWorker
    description: Workload-authenticated worker commands and reconciliation.
security:
  - sessionCookie: []
paths:
  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      summary: Return the current public or authenticated session
      security: []
      responses:
        "200":
          description: Session state
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/google/start:
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      summary: Start Google OAuth or OIDC login
      security: []
      parameters:
        - name: returnTo
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RelativeRoute"
        - name: intent
          in: query
          required: false
          schema:
            type: string
            enum: [projects, create-project]
      responses:
        "302":
          description: Redirect to the Google authorization endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
        default:
          $ref: "#/components/responses/Error"
      x-error-codes: [INVALID_RETURN_TO]
  /api/auth/google/callback:
    get:
      tags: [Auth]
      operationId: completeGoogleLogin
      summary: Validate the Google callback and issue a server session
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the validated same-origin return path
          headers:
            Location:
              schema:
                $ref: "#/components/schemas/RelativeRoute"
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
      x-error-codes: [OAUTH_STATE_INVALID, OAUTH_CALLBACK_FAILED]
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Error"
  /api/companies/search:
    get:
      tags: [Companies]
      operationId: searchCompanies
      summary: Search supported companies by name or ticker
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Company search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySearchResponse"
        default:
          $ref: "#/components/responses/Error"
      x-error-codes: [INVALID_COMPANY_QUERY, COMPANY_SEARCH_UNAVAILABLE]
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects owned by the current user
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated_desc, updated_asc, company_asc]
            default: updated_desc
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
      x-error-codes: [INVALID_PROJECT_QUERY, PROJECT_STATUS_UNAVAILABLE]
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project draft
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-error-codes: [INVALID_PROJECT_NAME, IDEMPOTENCY_CONFLICT, RATE_LIMITED]
  /api/projects/{projectId}/process/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Setup]
      operationId: getProjectSetup
      summary: Load the project setup workspace
      responses:
        "200":
          description: Setup workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupBootstrap"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [PROJECT_NOT_FOUND, SETUP_LOAD_FAILED]
    patch:
      tags: [Setup]
      operationId: saveProjectSetup
      summary: Save an incomplete or complete setup draft
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupWriteRequest"
      responses:
        "200":
          description: Setup draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupWriteResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes:
        - INVALID_SETUP_FIELD
        - STALE_PROJECT_VERSION
        - DOWNSTREAM_INVALIDATION_CONFIRMATION_REQUIRED
        - UNSUPPORTED_COMPANY
  /api/projects/{projectId}/process/setup/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Setup]
      operationId: completeProjectSetup
      summary: Save the exact setup and complete step 1
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupWriteRequest"
      responses:
        "200":
          description: Setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupCompleteResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes:
        - SETUP_INCOMPLETE
        - STALE_PROJECT_VERSION
        - DOWNSTREAM_INVALIDATION_CONFIRMATION_REQUIRED
        - UNSUPPORTED_COMPANY
  /api/projects/{projectId}/process/files:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Files]
      operationId: getFilesWorkspace
      summary: Load file slots, upload state, and inspection projection
      responses:
        "200":
          description: Files workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesBootstrap"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [FILES_PREREQUISITE_INCOMPLETE, FILES_STATE_LOAD_FAILED]
  /api/projects/{projectId}/files/upload-sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Files]
      operationId: createFileUploadSession
      summary: Create a quarantine upload session for a required file role
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileUploadRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [INVALID_FILE_TYPE, FILE_TOO_LARGE]
  /api/projects/{projectId}/files/upload-sessions/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadId"
    delete:
      tags: [Files]
      operationId: cancelFileUpload
      summary: Cancel an uncommitted upload session
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Upload cancelled
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [UPLOAD_ALREADY_COMMITTED]
  /api/projects/{projectId}/files/upload-sessions/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [Files]
      operationId: completeFileUpload
      summary: Verify uploaded bytes and start quarantine scanning
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "202":
          description: Upload verification accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [CHECKSUM_MISMATCH, UPLOAD_EXPIRED]
  /api/projects/{projectId}/validation:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Validation]
      operationId: getValidationWorkspace
      summary: Load the evidence-validation workspace
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [hypothesis, excel]
        - name: status
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Validation workspace
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationBootstrap"
        "304":
          $ref: "#/components/responses/NotModified"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [PREREQUISITE_INCOMPLETE, PLAN_REVALIDATION_REQUIRED]
  /api/projects/{projectId}/validation/results/{resultId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ResultId"
    get:
      tags: [Validation]
      operationId: getValidationResult
      summary: Load one validation result and its evidence links
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResultResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [RESULT_NOT_FOUND]
  /api/projects/{projectId}/evidence/{evidenceId}/viewer:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EvidenceId"
    get:
      tags: [Validation]
      operationId: getEvidenceViewer
      summary: Resolve a safe viewer locator for source evidence
      responses:
        "200":
          description: Evidence viewer locator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceViewerResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [EVIDENCE_NOT_FOUND, SOURCE_ACCESS_RESTRICTED]
  /api/projects/{projectId}/validation/workbook:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Validation]
      operationId: getValidationWorkbookReadModel
      summary: Load the read-only React workbook grid model
      responses:
        "200":
          description: Read-only validation workbook model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationWorkbookReadModel"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [WORKBOOK_VERSION_MISMATCH]
  /api/projects/{projectId}/validation/results/{resultId}/decisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ResultId"
    post:
      tags: [Validation]
      operationId: decideValidationResult
      summary: Accept a qualified result, reject, restore, or request re-research
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationDecisionRequest"
      responses:
        "200":
          description: Decision saved without a follow-up job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationMutationResponse"
        "202":
          description: Decision saved and follow-up work accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationMutationResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [STALE_VALIDATION_VERSION, INVALID_RESULT_TRANSITION, INVALID_DECISION_REASON]
  /api/projects/{projectId}/validation/conflicts/{conflictId}/decision:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ConflictId"
    post:
      tags: [Validation]
      operationId: decideValidationConflict
      summary: Resolve an evidence conflict
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictDecisionRequest"
      responses:
        "200":
          description: Conflict decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationMutationResponse"
        "202":
          description: Decision saved and recalculation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationMutationResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [CONFLICT_ALREADY_RESOLVED, STALE_VALIDATION_VERSION, INVALID_DECISION_REASON]
  /api/projects/{projectId}/validation/drafts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Validation]
      operationId: saveValidationDraft
      summary: Save validation notes and draft decisions
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationDraftRequest"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationMutationResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [INVALID_DECISION_REASON, STALE_VALIDATION_VERSION]
  /api/projects/{projectId}/validation/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Validation]
      operationId: completeValidationStep
      summary: Pin the approved validation version and complete step 5
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteValidationRequest"
      responses:
        "200":
          description: Validation step completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageCompleteResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [STAGE_GATE_BLOCKED, WORKBOOK_UPDATE_IN_PROGRESS]
  /api/projects/{projectId}/valuation:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Valuation]
      operationId: getValuationWorkspace
      summary: Load the PER valuation workspace
      responses:
        "200":
          description: Valuation workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationBootstrap"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [VALUATION_PREREQUISITE_INCOMPLETE]
  /api/projects/{projectId}/valuation/workbook:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Valuation]
      operationId: downloadValuationWorkbook
      summary: Download the authoritative valuation workbook
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Valuation workbook
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [WORKBOOK_VERSION_MISMATCH]
  /api/projects/{projectId}/valuation/workbook/cells:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Valuation]
      operationId: updateValuationWorkbookCells
      summary: Apply editable cell values and recalculate on the server
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkbookCellsUpdateRequest"
      responses:
        "200":
          description: Recalculated cell delta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookCellsUpdateResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [STALE_WORKBOOK_VERSION, READ_ONLY_CELL, FORMULA_CALCULATION_FAILED]
  /api/projects/{projectId}/valuation/draft:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags: [Valuation]
      operationId: saveValuationDraft
      summary: Save the valuation assumptions and authoritative result snapshot
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuationDraftRequest"
      responses:
        "200":
          description: Valuation draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationWriteResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [VALUATION_VERSION_CONFLICT, FORMULA_CALCULATION_FAILED]
  /api/projects/{projectId}/valuation/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Valuation]
      operationId: approveValuation
      summary: Approve the exact valuation version
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveValuationRequest"
      responses:
        "200":
          description: Valuation approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationWriteResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [VALUATION_APPROVAL_BLOCKED, CALCULATION_STALE]
  /api/projects/{projectId}/valuation/sensitivity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Valuation]
      operationId: calculateValuationSensitivity
      summary: Calculate a non-persistent sensitivity matrix
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitivityRequest"
      responses:
        "200":
          description: Sensitivity matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityResponse"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [SENSITIVITY_INPUT_INVALID]
  /api/projects/{projectId}/valuation/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Valuation]
      operationId: completeValuationStep
      summary: Pin the approved valuation version and complete step 6
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteValuationRequest"
      responses:
        "200":
          description: Valuation step completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageCompleteResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [VALUATION_NOT_APPROVED, STALE_VALUATION_VERSION]
  /api/projects/{projectId}/report-outline:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [ReportOutline]
      operationId: getReportOutline
      summary: Load the report-outline workspace and immutable template slots
      responses:
        "200":
          description: Report-outline workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOutlineBootstrap"
        default:
          $ref: "#/components/responses/Error"
      x-project-owner-required: true
      x-error-codes: [OUTLINE_PREREQUISITE_INCOMPLETE, OUTLINE_REVALIDATION_REQUIRED]
    patch:
      tags: [ReportOutline]
      operationId: updateReportOutline
      summary: Save editable page intent and evidence assignments
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportOutlineUpdateRequest"
      responses:
        "200":
          description: Updated outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOutlineWriteResponse"
        default:
          $ref: "#/components/responses/Error"
