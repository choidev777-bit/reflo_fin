          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryJobRequest"
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [JOB_NOT_RETRYABLE]
  /api/projects/{projectId}/source-uploads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Research]
      operationId: createSourceUpload
      summary: Create a direct-upload session for a research source
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceUploadRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [INVALID_FILE_TYPE, FILE_TOO_LARGE]
  /api/projects/{projectId}/source-uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [Research]
      operationId: getSourceUpload
      summary: Poll source ingestion status
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Source upload projection
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceUploadProjection"
        "304":
          $ref: "#/components/responses/NotModified"
        default:
          $ref: "#/components/responses/Error"
      x-job-polling: true
      x-project-owner-required: true
      x-error-codes: [UPLOAD_NOT_FOUND]
  /api/projects/{projectId}/source-uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [Research]
      operationId: completeSourceUpload
      summary: Commit a source upload and start ingestion
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "202":
          description: Source ingestion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        default:
          $ref: "#/components/responses/Error"
      x-idempotency-required: true
      x-project-owner-required: true
      x-error-codes: [CHECKSUM_MISMATCH, UPLOAD_EXPIRED]
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: reflo_session
      description: HttpOnly, Secure, SameSite=Lax server session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound token required for authenticated mutation requests.
    workloadIdentity:
      type: http
      scheme: bearer
      bearerFormat: short-lived workload identity
      description: Internal service identity with audience and workload-role validation.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    MappingSetId:
      name: mappingSetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    QuestionSetId:
      name: questionSetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    SourceReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ConflictId:
      name: conflictId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    EvidenceVersionId:
      name: evidenceVersionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    PreviewId:
      name: previewId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
  headers:
    RequestId:
      description: Correlation ID assigned by the edge or application server.
      schema:
        type: string
    ETag:
      description: Projection or immutable version validator.
      schema:
        type: string
    RetryAfter:
      description: Number of seconds before a safe retry.
      schema:
        type: integer
        minimum: 1
  responses:
    Error:
      description: Request failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotModified:
      description: Projection has not changed since If-None-Match.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    DecimalString:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      examples: ["12500.50"]
    TargetPerString:
      type: string
      pattern: "^(?:0\\.[1-9]|[1-9][0-9]?(?:\\.[0-9])?|100(?:\\.0)?)$"
      description: 0.1 이상 100.0 이하, 소수점 한 자리까지 허용한다.
      examples: ["12.5"]
    TargetPriceString:
      type: string
      pattern: "^(?:[1-9][0-9]{0,8}|1000000000)$"
      description: 1원 이상 1,000,000,000원 이하의 정수다.
      examples: ["125000"]
    RelativeRoute:
      type: string
      pattern: "^/(?!/)[^\\r\\n]*$"
      maxLength: 2048
      examples: ["/projects"]
    VersionNumber:
      type: integer
      minimum: 1
    StageKey:
      type: string
      enum: [setup, files, hypothesis, research_plan, validation, valuation, report_outline]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancel_requested, cancelled]
    JobValidity:
      type: string
      enum: [current, obsolete]
    Timestamp:
      type: string
      format: date-time
    VersionRef:
      type: object
      additionalProperties: false
      required: [versionId, version, lifecycleStatus, validityStatus, createdAt]
      properties:
        versionId:
          $ref: "#/components/schemas/OpaqueId"
        version:
          $ref: "#/components/schemas/VersionNumber"
        lifecycleStatus:
          type: string
          enum: [draft, approved, superseded]
        validityStatus:
          type: string
          enum: [current, revalidation_required, obsolete]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        hash:
          type: string
          minLength: 16
          maxLength: 128
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable, details]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        meta:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasNextPage]
      properties:
        nextCursor:
          type: [string, "null"]
        hasNextPage:
          type: boolean
    JobAccepted:
      type: object
      additionalProperties: false
      required: [jobId, operationStatus, phase, progressPercent, retryable, pollUrl]
      properties:
        jobId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          enum: [queued, running]
        phase:
          type: string
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        retryable:
          type: boolean
        pollUrl:
          $ref: "#/components/schemas/RelativeRoute"
        validationRoute:
          $ref: "#/components/schemas/RelativeRoute"
        acceptedAt:
          $ref: "#/components/schemas/Timestamp"
    InspectionAccepted:
      type: object
      additionalProperties: false
      required: [inspectionId, operationStatus, outcome, validity, statusUrl]
      properties:
        inspectionId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          const: queued
        outcome:
          type: string
          const: pending
        validity:
          type: string
          const: current
        statusUrl:
          $ref: "#/components/schemas/RelativeRoute"
    QuestionGenerationAccepted:
      type: object
      additionalProperties: false
      required: [generationId, operationStatus, validity, statusUrl]
      properties:
        generationId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          const: queued
        validity:
          type: string
          const: current
        statusUrl:
          $ref: "#/components/schemas/RelativeRoute"
    ResearchStartResponse:
      type: object
      additionalProperties: false
      required: [approvedPlanVersionId, job]
      properties:
        approvedPlanVersionId:
          $ref: "#/components/schemas/OpaqueId"
        job:
          $ref: "#/components/schemas/JobAccepted"
    TaskAccepted:
      type: object
      additionalProperties: false
      required: [taskId, operationStatus, statusUrl]
      properties:
        taskId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          const: queued
        statusUrl:
          $ref: "#/components/schemas/RelativeRoute"
    ReportOutlineApprovalAccepted:
      type: object
      additionalProperties: false
      required: [outline, draftTask]
      properties:
        outline:
          type: object
          additionalProperties: false
          required: [outlineId, version, status, approvedAt]
          properties:
            outlineId:
              $ref: "#/components/schemas/OpaqueId"
            version:
              $ref: "#/components/schemas/VersionNumber"
            status:
              type: string
              const: approved
            approvedAt:
              $ref: "#/components/schemas/Timestamp"
        draftTask:
          type: object
          additionalProperties: false
          required: [taskId, operationStatus, reportRoute]
          properties:
            taskId:
              $ref: "#/components/schemas/OpaqueId"
            operationStatus:
              type: string
              const: queued
            reportRoute:
              $ref: "#/components/schemas/RelativeRoute"
    AiProposalAccepted:
      type: object
      additionalProperties: false
      required: [proposalId, operationStatus, statusUrl]
      properties:
        proposalId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          const: queued
        statusUrl:
          $ref: "#/components/schemas/RelativeRoute"
    ReportPreviewAccepted:
      type: object
      additionalProperties: false
      required: [previewId, operationStatus, statusUrl]
      properties:
        previewId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          const: queued
        statusUrl:
          $ref: "#/components/schemas/RelativeRoute"
    ReportValidationAccepted:
      type: object
      additionalProperties: false
      required: [runId, operationStatus, statusUrl]
      properties:
        runId:
          $ref: "#/components/schemas/OpaqueId"
        operationStatus:
          type: string
          const: queued
        statusUrl:
          $ref: "#/components/schemas/RelativeRoute"
    JobProjection:
      type: object
      additionalProperties: true
      required: [jobId, operationStatus, validity, progressMode, progressPercent, retryable]
      properties:
        jobId:
          $ref: "#/components/schemas/OpaqueId"
        jobType:
          type: string
        operationStatus:
          $ref: "#/components/schemas/JobStatus"
        validity:
          $ref: "#/components/schemas/JobValidity"
        progressMode:
          type: string
          enum: [determinate, indeterminate]
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        phase:
          type: [string, "null"]
        message:
          type: [string, "null"]
        attempt:
          type: integer
          minimum: 1
        heartbeatAt:
          type: [string, "null"]
          format: date-time
        retryable:
          type: boolean
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        resultRefs:
          type: array
          items:
            $ref: "#/components/schemas/VersionRef"
        links:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RelativeRoute"
        error:
          oneOf:
            - $ref: ../schemas/v1/worker-error.schema.json
            - type: "null"
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
    SessionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [authenticated]
          properties:
            authenticated:
              const: false
        - type: object
          additionalProperties: false
          required: [authenticated, user, csrfToken, expiresAt]
          properties:
            authenticated:
              const: true
            user:
              $ref: "#/components/schemas/SessionUser"
            csrfToken:
              type: string
              minLength: 32
            expiresAt:
              $ref: "#/components/schemas/Timestamp"
    CompanySummary:
      type: object
      additionalProperties: false
      required: [companyId, corpCode, name, ticker, exchange, industry, listed, mvpEligible]
      properties:
        companyId:
          $ref: "#/components/schemas/OpaqueId"
        corpCode:
          type: string
        name:
          type: string
        ticker:
          type: string
        exchange:
          type: string
          enum: [KOSPI, KOSDAQ]
        industry:
          type: string
        listed:
          type: boolean
        mvpEligible:
          type: boolean
        ineligibilityReason:
          type: [string, "null"]
    CompanySearchResponse:
      type: object
      additionalProperties: false
      required: [query, items]
      properties:
        query:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanySummary"
    ProjectSummary:
      type: object
      additionalProperties: true
      required: [id, name, company, currentStage, status, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        company:
          $ref: "#/components/schemas/CompanySummary"
        currentStage:
          $ref: "#/components/schemas/StageKey"
        status:
          type: string
          enum: [draft, active, completed, archived]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        clientMutationId:
          type: string
          maxLength: 128
    CreateProjectResponse:
      type: object
      additionalProperties: false
      required: [project, nextUrl]
      properties:
        project:
          $ref: "#/components/schemas/ProjectSummary"
        nextUrl:
          $ref: "#/components/schemas/RelativeRoute"
    SetupBootstrap:
      type: object
      additionalProperties: true
      required: [project, setup, workflow, supportedTargetYears]
      properties:
        project:
          type: object
          additionalProperties: true
          required: [projectId, name, status, currentStage, version, updatedAt]
          properties:
            projectId:
              $ref: "#/components/schemas/OpaqueId"
            name:
              type: string
            status:
              type: string
              enum: [draft, active, completed]
            currentStage:
              $ref: "#/components/schemas/StageKey"
            version:
              $ref: "#/components/schemas/VersionNumber"
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
        setup:
          type: object
          additionalProperties: true
          required: [company, targetPeriod, cutoffDate, reportType, companyDomain, valuationMethod, status, version]
          properties:
            company:
              oneOf:
                - $ref: "#/components/schemas/CompanySummary"
                - type: "null"
            targetPeriod:
              type: [object, "null"]
              additionalProperties: false
              properties:
                year:
                  type: integer
                quarter:
                  type: integer
                  minimum: 1
                  maximum: 4
            cutoffDate:
              type: [string, "null"]
              format: date
            reportType:
              type: string
              const: EARNINGS_REVIEW
            companyDomain:
              type: string
              const: IT_MANUFACTURING
            valuationMethod:
              type: string
              const: PER
            status:
              type: string
              enum: [draft, complete]
            version:
              $ref: "#/components/schemas/VersionNumber"
        workflow:
          type: object
          additionalProperties: true
          required: [stageStates, allowedRoutes, downstreamImpact]
          properties:
            stageStates:
              type: array
              items:
                type: object
                additionalProperties: true
            allowedRoutes:
              type: array
              items:
                $ref: "#/components/schemas/RelativeRoute"
            downstreamImpact:
              type: array
              items:
                $ref: "#/components/schemas/StageKey"
        supportedTargetYears:
          type: array
          items:
            type: integer
    SetupWriteRequest:
      type: object
      additionalProperties: false
      required: [projectVersion, setup, confirmDownstreamInvalidation]
      properties:
        projectVersion:
          $ref: "#/components/schemas/VersionNumber"
        setup:
          type: object
          additionalProperties: false
          properties:
            companyId:
              oneOf:
                - $ref: "#/components/schemas/OpaqueId"
                - type: "null"
            targetPeriod:
              type: [object, "null"]
              additionalProperties: false
              required: [year, quarter]
              properties:
                year:
                  type: integer
                quarter:
                  type: integer
                  minimum: 1
                  maximum: 4
            cutoffDate:
              type: [string, "null"]
              format: date
        confirmDownstreamInvalidation:
          type: boolean
          default: false
    SetupWriteResponse:
      type: object
      additionalProperties: false
      required: [projectVersion, setupVersion, savedAt, setupStatus, complete, invalidatedStages]
      properties:
        projectVersion:
          $ref: "#/components/schemas/VersionNumber"
        setupVersion:
          $ref: "#/components/schemas/VersionNumber"
        savedAt:
          $ref: "#/components/schemas/Timestamp"
        setupStatus:
          type: string
          enum: [draft, complete]
        complete:
          type: boolean
        invalidatedStages:
          type: array
          items:
            $ref: "#/components/schemas/StageKey"
    SetupCompleteResponse:
      type: object
      additionalProperties: false
      required: [projectVersion, setupVersion, setupStatus, currentStage, currentRoute, invalidatedStages]
      properties:
        projectVersion:
          $ref: "#/components/schemas/VersionNumber"
        setupVersion:
          $ref: "#/components/schemas/VersionNumber"
        setupStatus:
          type: string
          const: complete
        currentStage:
          type: string
          const: files
        currentRoute:
          $ref: "#/components/schemas/RelativeRoute"
        invalidatedStages:
          type: array
          items:
            $ref: "#/components/schemas/StageKey"
    StageCompleteResponse:
      type: object
      additionalProperties: true
      required: [completedStage, nextStage, nextUrl, projectVersion]
      properties:
        completedStage:
          $ref: "#/components/schemas/StageKey"
        nextStage:
          oneOf:
            - $ref: "#/components/schemas/StageKey"
            - type: "null"
        nextUrl:
          oneOf:
            - $ref: "#/components/schemas/RelativeRoute"
            - type: "null"
        projectVersion:
          $ref: "#/components/schemas/VersionNumber"
        completedAt:
          $ref: "#/components/schemas/Timestamp"
    FileRole:
      type: string
      enum: [previous_report_pdf, analysis_workbook]
    FileVersionSummary:
      type: object
      additionalProperties: true
      required: [fileVersionId, role, fileName, status, version]
      properties:
        fileVersionId:
          $ref: "#/components/schemas/OpaqueId"
        role:
          $ref: "#/components/schemas/FileRole"
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [uploading, scanning, accepted, rejected, cancelled]
        version:
          $ref: "#/components/schemas/VersionNumber"
    FilesBootstrap:
      type: object
      additionalProperties: true
      required: [projectId, projectVersion, slots]
      properties:
        projectId:
